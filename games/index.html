    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="../assets/css/style.css">

<body>

    <header id="sidebar">
        <div class="brand">
            <a href="../index.html" style="text-decoration: none;">
                <h1 class="site-title">Patinart</h1>
            </a>
            <p class="site-subtitle">Patina & Art Works</p>
        </div>
        
        <button class="menu-toggle" aria-label="Toggle Navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-menu">
            <ul>
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="./index.html" class="nav-link active">Games</a></li>
                <li><a href="../art/index.html" class="nav-link">Art</a></li>
                <li><a href="../devlog/index.html" class="nav-link">Devlog</a></li>
            </ul>
            <div class="nav-footer">
                <small>&copy; Patinart</small>
            </div>
        </nav>
    </header>

    <main id="main-content">
        <div class="container">
            <h2 class="section-title" style="position: relative; top: 0; color: rgba(255,255,255,0.2);">Game Collection</h2>
            <p style="margin-bottom: 3rem; color: var(--c-bronze);">これまでに制作したゲーム作品一覧</p>

            <div class="card-grid">
                <article class="card">
                    <div class="card-image">
                        <a href="./img/img01.jpg" data-lightbox="games-archive" data-title="development">
                            <img src="./img/img01.jpg" alt="Game 1">
                        </a>
                    </div>
                    <div class="card-content">
                        <h4>火星cafeアンティークSHAKOBA</h4>
                        <p>目が覚めたら火星にいた。<br>記憶を失った主人公が過去を取り戻すミステリーADV。</p>
                        <span class="btn-text">In Development(開発中)</span>
                    </div>
                </article>

                <article class="card">
                    <div class="card-image">
                        <a href="https://placehold.co/800x600/556B2F/FFF?text=Game+Screen+2" data-lightbox="games-archive" data-title="development">
                            <img src="https://placehold.co/600x400/556B2F/FFF?text=development" alt="Game 2">
                        </a>
                    </div>
                    <div class="card-content">
                        <h4>Forest of Patina</h4>
                        <p>緑青の森を探索するADV。</p>
                        <span class="btn-text">In Development(開発中)</span>
                    </div>
                </article>
